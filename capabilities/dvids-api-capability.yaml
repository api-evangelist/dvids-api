  - type: rest
    port: 8080
    namespace: dvids-api-rest
    description: REST adapter for DVIDS API.
    resources:
    - path: /search
      name: searchassets
      operations:
      - method: GET
        name: searchassets
        description: Search assets
        call: dvids-api.searchassets
        outputParameters:
        - type: object
          mapping: $.
    - path: /asset
      name: getasset
