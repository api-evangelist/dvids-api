naftiko: 1.0.0-alpha2
info:
  label: DVIDS API
  description: The Defense Visual Information Distribution Service (DVIDS) API provides programmatic access to U.S. military
    news, photos, video, audio, publications, units, and live events. The API is implemented as JSON over HTTP and requires
    a public API key.
  tags:
  - Dvids
  - Api
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: dvids-api
    baseUri: https://api.dvidshub.net
    description: DVIDS API HTTP API.
    authentication:
      type: apikey
      in: query
      name: api_key
      value: '{{DVIDS_API_TOKEN}}'
    resources:
    - name: search
      path: /search
      operations:
      - name: searchassets
        method: GET
        description: Search assets
        inputParameters:
        - name: api_key
          in: query
          type: string
          required: true
        - name: q
          in: query
          type: string
        - name: branch
          in: query
          type: string
        - name: type
          in: query
          type: string
        - name: category
          in: query
          type: string
        - name: categories_exclude
          in: query
          type: string
        - name: country
          in: query
          type: string
        - name: state
          in: query
          type: string
        - name: city
          in: query
          type: string
        - name: unit_name
          in: query
          type: string
        - name: unit
          in: query
          type: string
        - name: unit_id
          in: query
          type: integer
        - name: credit
          in: query
          type: string
        - name: from_date
          in: query
          type: string
        - name: to_date
          in: query
          type: string
        - name: from_publishdate
          in: query
          type: string
        - name: to_publishdate
          in: query
          type: string
        - name: timestamp
          in: query
          type: string
        - name: from_duration
          in: query
          type: integer
        - name: to_duration
          in: query
          type: integer
        - name: aspect_ratio
          in: query
          type: string
        - name: hd
          in: query
          type: integer
        - name: has_image
          in: query
          type: boolean
        - name: has_captions
          in: query
          type: boolean
        - name: max_results
          in: query
          type: integer
        - name: page
          in: query
          type: integer
        - name: sort
          in: query
          type: string
        - name: sortdir
          in: query
          type: string
        - name: format
          in: query
          type: string
        - name: fields
          in: query
          type: string
        - name: thumb_width
          in: query
          type: integer
        - name: thumb_height
          in: query
          type: integer
        - name: thumb_quality
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: asset
      path: /asset
      operations:
      - name: getasset
        method: GET
        description: Get asset
        inputParameters:
        - name: api_key
          in: query
          type: string
          required: true
        - name: id
          in: query
          type: string
          required: true
        - name: fields
          in: query
          type: string
        - name: prettyprint
          in: query
          type: boolean
        - name: thumb_width
          in: query
          type: integer
        - name: thumb_height
          in: query
          type: integer
        - name: thumb_quality
          in: query
          type: integer
        - name: include_related_media
          in: query
          type: boolean
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: asset-related
      path: /asset/related
      operations:
